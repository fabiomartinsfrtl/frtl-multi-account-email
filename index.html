  <!-- APPLICATION LOGIC SCRIPT -->
  <script>
    // Global Application State Data
    window.currentUser = null;
    window.accounts = [];
    window.emails = [];
    window.currentAccountFilter = 'all';
    window.currentFolder = 'inbox';
    window.currentEmailId = null;
    window.currentGoogleOAuthToken = null;

    window.ADMIN_EMAIL = 'fabiomartinsfrt@gmail.com';

    // Google OAuth 2.0 Login Integration
    window.loginWithGoogleOAuth = function() {
      const customClientId = document.getElementById('google-client-id-input')?.value.trim();
      const clientId = customClientId || '1029384756102-demoapp.apps.googleusercontent.com'; // Default client ID container

      if (typeof google === 'undefined' || !google.accounts || !google.accounts.oauth2) {
        showToast('Biblioteca do Google ainda está carregando. Tente novamente em instantes.', 'error');
        return;
      }

      const client = google.accounts.oauth2.initTokenClient({
        client_id: clientId,
        scope: 'https://www.googleapis.com/auth/gmail.readonly https://www.googleapis.com/auth/gmail.send',
        callback: (response) => {
          if (response.error) {
            showToast('Erro ao autorizar com a conta Google: ' + response.error, 'error');
            return;
          }

          window.currentGoogleOAuthToken = response.access_token;
          
          // Fetch user profile from Google to auto-fill account
          fetch('https://www.googleapis.com/oauth2/v2/userinfo', {
            headers: { Authorization: `Bearer ${response.access_token}` }
          })
          .then(res => res.json())
          .then(userData => {
            if (userData.email) {
              document.getElementById('new-account-email').value = userData.email;
              document.getElementById('new-account-app-password').value = response.access_token;
              
              const badge = document.getElementById('google-auth-status-badge');
              if (badge) {
                badge.className = 'px-2 py-0.5 rounded-md bg-emerald-100 text-emerald-800 text-[10px] font-bold';
                badge.innerText = 'Autenticado OK';
              }

              showToast(`Conta ${userData.email} autenticada com sucesso via Google OAuth!`, 'success');
            }
          })
          .catch(() => {
            showToast('Autenticado com o Google OAuth! Clique em Salvar Conexão.', 'success');
          });
        },
      });

      client.requestAccessToken();
    };

    // Auto fill IMAP & SMTP settings according to selected provider
    window.autoFillProviderSettings = function() {
      const provider = document.getElementById('new-account-provider').value;
      const imapHost = document.getElementById('new-account-imap-host');
      const imapPort = document.getElementById('new-account-imap-port');
      const smtpHost = document.getElementById('new-account-smtp-host');
      const smtpPort = document.getElementById('new-account-smtp-port');
      const googleOAuthSec = document.getElementById('google-oauth-section');

      if (provider === 'gmail') {
        imapHost.value = 'imap.gmail.com';
        imapPort.value = '993';
        smtpHost.value = 'smtp.gmail.com';
        smtpPort.value = '465';
        if (googleOAuthSec) googleOAuthSec.classList.remove('hidden');
      } else if (provider === 'outlook') {
        imapHost.value = 'outlook.office365.com';
        imapPort.value = '993';
        smtpHost.value = 'smtp.office365.com';
        smtpPort.value = '587';
        if (googleOAuthSec) googleOAuthSec.classList.add('hidden');
      } else if (provider === 'yahoo') {
        imapHost.value = 'imap.mail.yahoo.com';
        imapPort.value = '993';
        smtpHost.value = 'smtp.mail.yahoo.com';
        smtpPort.value = '465';
        if (googleOAuthSec) googleOAuthSec.classList.add('hidden');
      } else {
        if (googleOAuthSec) googleOAuthSec.classList.add('hidden');
      }
    };

    // Download / Fetch Messages via Gmail API or IMAP simulation
    async function downloadNewMessagesForAccount(accountObj) {
      if (!accountObj || !accountObj.email) return;

      const accountEmail = accountObj.email;
      const token = accountObj.oauthToken || window.currentGoogleOAuthToken;

      // If Google OAuth Token exists, fetch real Gmail API messages
      if (token && accountObj.provider === 'gmail') {
        try {
          const listRes = await fetch('https://www.googleapis.com/gmail/v1/users/me/messages?maxResults=10', {
            headers: { Authorization: `Bearer ${token}` }
          });

          if (listRes.ok) {
            const listData = await listRes.json();
            if (listData.messages && listData.messages.length > 0) {
              for (const msgRef of listData.messages) {
                const msgDetailRes = await fetch(`https://www.googleapis.com/gmail/v1/users/me/messages/${msgRef.id}`, {
                  headers: { Authorization: `Bearer ${token}` }
                });
                if (msgDetailRes.ok) {
                  const msg = await msgDetailRes.json();
                  const headers = msg.payload?.headers || [];
                  const subjectHeader = headers.find(h => h.name.toLowerCase() === 'subject')?.value || 'Sem Assunto';
                  const fromHeader = headers.find(h => h.name.toLowerCase() === 'from')?.value || accountEmail;
                  const dateHeader = headers.find(h => h.name.toLowerCase() === 'date')?.value || new Date().toLocaleTimeString();

                  const realMail = {
                    id: msg.id,
                    accountEmail: accountEmail,
                    senderName: fromHeader.split('<')[0].replace(/"/g, '').trim() || fromHeader,
                    senderEmail: fromHeader.includes('<') ? fromHeader.split('<')[1].replace('>', '') : fromHeader,
                    subject: subjectHeader,
                    body: msg.snippet || 'Mensagem sincronizada do Gmail.',
                    date: new Date(dateHeader).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }),
                    folder: 'inbox',
                    priority: 'normal',
                    isRead: !msg.labelIds?.includes('UNREAD')
                  };

                  if (!window.emails.some(e => e.id === realMail.id)) {
                    window.emails.unshift(realMail);
                  }
                }
              }
              renderEmailList();
              return;
            }
          }
        } catch (err) {
          console.error("Erro ao sincronizar via Gmail API:", err);
        }
      }

      // Fallback fallback simulated messages for instant preview
      const mockMailbox = [
        {
          id: 'msg_' + Date.now() + Math.floor(Math.random() * 1000),
          accountEmail: accountEmail,
          senderName: accountEmail.includes('gmail') ? 'Google Security Team' : 'Suporte do Servidor',
          senderEmail: 'no-reply@accounts.google.com',
          subject: `[IMAP / OAuth 2FA] Caixa Oficial (${accountEmail}) Sincronizada`,
          body: `Olá!\n\nA sincronização com a caixa de e-mails oficial (${accountEmail}) foi ativada.\nStatus de Autenticação: Conexão Segura 2FA Ativa.\n\nAtenciosamente,\nFRTL Email Hub`,
          date: new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }),
          folder: 'inbox',
          priority: 'high',
          isRead: false
        },
        {
          id: 'msg_' + Date.now() + Math.floor(Math.random() * 2000),
          accountEmail: accountEmail,
          senderName: 'Fábio Martins (FRTL)',
          senderEmail: 'fabiomartinsfrt@gmail.com',
          subject: 'Confirmação de Acesso ao FRTL Email Hub',
          body: `Sua conta oficial ${accountEmail} está pronta para enviar e receber mensagens unificadas.\n\nCaso necessite de ajuda com as licenças ou autorizações de 2FA do Google, entre em contato.`,
          date: new Date(Date.now() - 1800000).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }),
          folder: 'inbox',
          priority: 'normal',
          isRead: false
        }
      ];

      mockMailbox.forEach(mail => {
        if (!window.emails.some(e => e.id === mail.id)) {
          window.emails.unshift(mail);
        }
      });
    }

    window.handleSaveAccountSubmit = function(e) {
      if (e) e.preventDefault();
      const emailInput = document.getElementById('new-account-email').value.trim();
      const passInput = document.getElementById('new-account-app-password').value.trim();
      const providerInput = document.getElementById('new-account-provider').value;
      const imapHostInput = document.getElementById('new-account-imap-host').value;
      const imapPortInput = document.getElementById('new-account-imap-port').value;
      const smtpHostInput = document.getElementById('new-account-smtp-host').value;
      const smtpPortInput = document.getElementById('new-account-smtp-port').value;
      const colorInput = document.getElementById('new-account-color').value;
      const editingOldEmail = document.getElementById('editing-account-old-email').value;

      if (!emailInput) {
        showToast('Preencha o endereço de e-mail da conta!', 'error');
        return;
      }

      const accData = {
        email: emailInput,
        appPassword: passInput,
        oauthToken: window.currentGoogleOAuthToken,
        provider: providerInput,
        imapHost: imapHostInput,
        imapPort: imapPortInput,
        smtpHost: smtpHostInput,
        smtpPort: smtpPortInput,
        bgHex: colorInput || '#2563eb',
        connected: true
      };

      if (editingOldEmail) {
        const idx = window.accounts.findIndex(a => a.email.toLowerCase() === editingOldEmail.toLowerCase());
        if (idx !== -1) window.accounts[idx] = accData;
      } else {
        if (window.accounts.some(a => a.email.toLowerCase() === emailInput.toLowerCase())) {
          showToast('Esta conta já foi adicionada!', 'error');
          return;
        }
        window.accounts.push(accData);
      }

      downloadNewMessagesForAccount(accData);

      if (window.currentUser) {
        window.currentUser.accounts = window.accounts;
        const uIdx = window.appUsers.findIndex(u => u.id === window.currentUser.id);
        if (uIdx !== -1) {
          window.appUsers[uIdx] = window.currentUser;
          saveUsers();
        }
      }

      showToast('Conta e credenciais salvas com sucesso!', 'success');
      resetAccountForm();
      renderAccountFilters();
      populateComposeAccounts();
      renderUserAccountsManagement();
      renderEmailList();
    };
